<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#070a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Delta">
<link rel="apple-touch-icon" id="touchIcon" href="">
<title>Delta</title>
<style>
:root,:root[data-scheme="dark"]{
  --bg:#070a0f; --surface:#0f151d; --surface2:#18212c; --line:#223040;
  --text:#e8eef5; --muted:#8a9bb0; --accent:#38bdf8; --accent-ink:#03222e; --link:#38bdf8;
  --up:#34d399; --down:#fb7185; --glow:rgba(45,212,191,.16); --thumb:#2a3a4d;
  --font:ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
}
:root[data-scheme="light"]{
  --bg:#f3f7f8; --surface:#ffffff; --surface2:#e7eef0; --line:#d3dee1;
  --text:#0e1a1f; --muted:#4f6870; --accent:#0369a1; --accent-ink:#ffffff; --link:#0369a1;
  --up:#15803d; --down:#dc2626; --glow:rgba(45,212,191,.24); --thumb:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
html,body{margin:0;overscroll-behavior-y:contain;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.45}
body{position:relative;min-height:calc(100% + 2px);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:18px 18px 40px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .14s cubic-bezier(.2,.8,.3,1)}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
h1{font-size:32px;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);font-size:15px;margin:0 0 18px}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.seg{position:relative;display:flex;background:var(--surface2);border-radius:13px;padding:3px}
.seg button{position:relative;z-index:1;flex:1;padding:9px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--text);font-weight:700}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n,2));border-radius:10px;background:var(--thumb);
  box-shadow:0 1px 3px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.1);translate:calc(var(--i,0)*100%) 0;transition:translate .5s cubic-bezier(.34,1.45,.5,1)}
.controls{display:grid;gap:12px;margin-bottom:14px}
.row2{display:flex;gap:10px;align-items:center}
.stepper{display:flex;align-items:center;background:var(--surface2);border-radius:13px;padding:3px;flex:none}
.stepper button{width:40px;height:34px;border-radius:10px;font-size:22px;font-weight:600;color:var(--link)}
.stepper .val{min-width:78px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.chip{background:var(--surface2);border-radius:99px;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.grow{flex:1}

.summary{font-size:14px;color:var(--muted);margin:2px 4px 10px}
.group{background:var(--surface);border:.5px solid var(--line);border-radius:22px;overflow:hidden}
.item{display:grid;grid-template-columns:34px 1fr 64px auto;gap:8px;align-items:center;padding:12px 14px 12px 6px;border-top:.5px solid var(--line)}
.item:first-child{border-top:0}
.star{font-size:20px;color:var(--muted);padding:4px}
.star.on{color:#ff9f0a}
.tk b{font-size:17px;letter-spacing:-.01em}
.tk span{display:block;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.spark{width:64px;height:26px}
.spark polyline{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chg{text-align:right;font-variant-numeric:tabular-nums}
.chg b{display:block;font-size:17px}
.chg span{font-size:14px}
.up{color:var(--up)} .down{color:var(--down)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:16px 4px 0}
.warn{background:color-mix(in srgb,var(--down) 12%,var(--surface));border:.5px solid color-mix(in srgb,var(--down) 40%,var(--line));border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:12px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.top{margin-bottom:14px}
.panel{background:var(--surface2);padding:14px 16px 16px;border-top:.5px solid var(--line)}
.panel h3{margin:0 0 8px;font-size:15px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:.5px solid var(--line);font-size:16px}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.big-amt{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0 6px}
.btn{background:linear-gradient(135deg,#22c55e,#2dd4bf 55%,#38bdf8);color:#05261f;border-radius:13px;padding:12px 18px;font-weight:700;font-size:16px}
.btn.ghost{background:var(--surface2);color:var(--text);font-weight:600}
.panel .btn.ghost{background:var(--surface)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.card{background:var(--surface);border:.5px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 10px}
.frow{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:8px 0;border-top:.5px solid var(--line)}
.frow:first-of-type{border-top:0}
.frow label{font-size:16px}
.frow small{display:block;color:var(--muted);font-size:13px;line-height:1.3}
input[type=number],input[type=text],input[type=date],textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 10px;text-align:right}
input[type=text],input[type=date],textarea{text-align:left}
textarea{min-height:90px;font-size:13px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:.5px solid var(--line);font-size:16px}
.chk input{width:22px;height:22px}
.pos{padding:14px 0;border-top:.5px solid var(--line)}
.pos:first-of-type{border-top:0;padding-top:0}
.pos-h{display:flex;justify-content:space-between;align-items:baseline}
.pos-h b{font-size:18px}
.lot{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);padding:3px 0}
.lot button{color:var(--down);font-size:14px;padding:0 4px}
.flag{background:color-mix(in srgb,var(--accent) 12%,var(--surface2));border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
.flag b{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:.5px solid var(--line);border-radius:18px;padding:12px 14px}
.tile .n{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.hint2{font-size:14px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.help{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.helptext{margin:0 0 10px;font-size:16px;line-height:1.45}
.helptext b{font-weight:700}
.link-btn{color:var(--link);font-size:15px;padding:6px 2px;margin-bottom:8px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;flex:none;filter:drop-shadow(0 4px 12px rgba(45,212,191,.35))}

/* Delta look: ambient glow, live status, pills, motion */
body::before{content:"";position:absolute;top:0;left:0;right:0;height:360px;background:radial-gradient(60% 100% at 50% 0,var(--glow),transparent 72%);pointer-events:none;z-index:0}
.fresh{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border-radius:99px;padding:6px 13px;font-size:14px;color:var(--muted);margin:0 0 16px;max-width:100%}
.fresh .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.fresh.live .dot{background:var(--up);animation:ping 2.2s ease-out infinite}
.fresh.stale .dot{background:#f59e0b}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 55%,transparent)}80%,100%{box-shadow:0 0 0 9px transparent}}
.icon-btn .ic-check{display:none}
.icon-btn.ok .ic-arrow{display:none}
.icon-btn.ok .ic-check{display:block;stroke:var(--up)}
.icon-btn.spin .ic-arrow{animation:spin .8s linear infinite}
#ptr{position:absolute;top:calc(env(safe-area-inset-top,0px) + 4px);left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;z-index:2}
#ptr svg{width:26px;height:26px;stroke:var(--link);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
#ptr.spin svg{animation:spin .8s linear infinite}
.chg b{display:inline-block;padding:1px 10px;border-radius:99px;font-size:16px}
.chg b.up{background:color-mix(in srgb,var(--up) 15%,transparent)}
.chg b.down{background:color-mix(in srgb,var(--down) 15%,transparent)}
.chg b.neu{background:var(--surface2)}
.chg span{display:block;margin-top:2px}
#list.enter .item{animation:rowIn .55s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*24ms)}
#list.enter .spark polyline{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1s .15s cubic-bezier(.22,1,.36,1) forwards}
@keyframes rowIn{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
@keyframes draw{to{stroke-dashoffset:0}}
.panel.pin{animation:panelIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes panelIn{from{opacity:0;translate:0 -8px}to{opacity:1;translate:0 0}}
</style>
</head>
<body>
<div id="ptr"><svg viewBox="0 0 24 24"><path d="M12 4v13"/><path d="M6 12l6 6 6-6"/></svg></div>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <radialGradient id="lbg" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#1b2636"/><stop offset="1" stop-color="#07090d"/></radialGradient>
          <linearGradient id="lst" x1=".15" y1=".85" x2=".85" y2=".15"><stop offset="0" stop-color="#22c55e"/><stop offset=".55" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
        </defs>
        <rect width="32" height="32" rx="9" fill="url(#lbg)"/>
        <path d="M14.86 9.05Q16.00 7.04 17.14 9.05L23.69 20.58Q24.83 22.59 22.52 22.59L9.48 22.59Q7.17 22.59 8.31 20.58Z" fill="none" stroke="url(#lst)" stroke-width="3.02" stroke-linejoin="round"/>
        <path d="M15.56 17.25Q16.00 16.48 16.44 17.25L18.06 20.11Q18.50 20.89 17.61 20.89L14.39 20.89Q13.50 20.89 13.94 20.11Z" fill="#fff"/>
      </svg>
      <h1>Delta</h1>
    </div>
    <button class="icon-btn" id="refresh" aria-label="Load the latest saved prices" title="Load the latest saved prices">
      <svg class="ic-arrow" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
      <svg class="ic-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </button>
  </header>
  <div class="fresh" id="fresh"><i class="dot"></i><span id="status">Loading…</span></div>
  <div id="warn" class="warn hidden"></div>

  <div class="seg top" id="tabSeg" role="group" aria-label="Section"></div>
  <div id="moversPane">
  <div class="controls">
    <div class="seg" id="viewSeg" role="group" aria-label="View"></div>
    <div class="row2">
      <div class="stepper" aria-label="Minimum move">
        <button id="minus" aria-label="Lower the minimum">&minus;</button>
        <span class="val" id="minVal">$5</span>
        <button id="plus" aria-label="Raise the minimum">+</button>
      </div>
      <div class="seg grow" id="dirSeg" role="group" aria-label="Direction"></div>
    </div>
    <div class="row2">
      <div class="seg" id="unitSeg" role="group" aria-label="Measure moves in" style="width:104px;flex:none"></div>
      <button class="chip" id="mine" aria-pressed="false">&#9733; Mine</button>
      <button class="chip" id="sort" aria-pressed="false">Sort by %</button>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="group" id="list"></div>
  <p class="note">Prices come from Yahoo Finance and can be delayed or wrong. Delta shows how much stocks are moving. Amounts it calculates come from the rules you set in Plan. They are not predictions or advice.</p>
  </div>
  <div id="calcPane" class="hidden"></div>
  <div id="posPane" class="hidden"></div>
  <div id="planPane" class="hidden"></div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const STEPS=[1,2,3,4,5,7.5,10,15,20,30,50];
  const store={
    get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v===null||v===undefined?d:v; }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  };
  let view=store.get("view","today"), dir=store.get("dir","all"), minIdx=store.get("minIdx",STEPS.indexOf(5)), byPct=store.get("byPct",false), mineOnly=store.get("mine",false);
  let stars=new Set(store.get("stars",[])), data=null, loadedAt=0;
  if(minIdx<0||minIdx>=STEPS.length) minIdx=STEPS.indexOf(5);
  const STEPS_PCT=[1,2,3,5,7.5,10,15,20,30];
  let unit=store.get("unit","usd"), minIdxP=store.get("minIdxP",STEPS_PCT.indexOf(5));
  if(unit!=="usd"&&unit!=="pct") unit="usd";
  if(minIdxP<0||minIdxP>=STEPS_PCT.length) minIdxP=STEPS_PCT.indexOf(5);
  const curSteps=()=>unit==="pct"?STEPS_PCT:STEPS, curIdx=()=>unit==="pct"?minIdxP:minIdx, curMin=()=>curSteps()[curIdx()];
  function setIdx(i){ if(unit==="pct"){ minIdxP=i; store.set("minIdxP",i); } else { minIdx=i; store.set("minIdx",i); } }
  function minLabel(){ const m=curMin(); return unit==="pct"?m+"%":money(m); }
  const tpct=x=>Math.abs(x.avg/x.p*100);
  const DEFAULTS={account:1000,cash:500,riskPct:1,maxPosPct:25,stopK:2,rr:2,tpPct:20,stopPct:10,orderFee:0.15,regPerM:5.10,depFee:false,depPct:0.9,depMin:2,wdFee:false,wdAmt:5,touched:false};
  let plan=Object.assign({},DEFAULTS,store.get("plan",{}));
  let lots=store.get("lots",[]);
  let tab=store.get("tab","movers"), openT=null;
  if(["movers","calc","pos","plan"].indexOf(tab)<0) tab="movers";
  let whatif={t:"",usd:10,entry:"",mode:"usd",val:20};
  const savePlan=()=>store.set("plan",plan), saveLots=()=>store.set("lots",lots);


  // ===== Appearance and live status =====
  let appearance=store.get("appearance","dark"), justLoaded=false, pinPanel=false, flashT=null;
  function applyScheme(){
    const sc=appearance==="auto"?((window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark"):appearance;
    document.documentElement.setAttribute("data-scheme",sc);
    const m=document.getElementById("themeColor"); if(m) m.setAttribute("content",sc==="dark"?"#070a0f":"#f3f7f8");
  }
  applyScheme();
  try{ matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{ if(appearance==="auto") applyScheme(); }); }catch(e){}
  function marketOpen(){
    try{
      const f=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",hour:"numeric",minute:"numeric",hourCycle:"h23"}), P={};
      f.formatToParts(new Date()).forEach(x=>{ P[x.type]=x.value; });
      if(P.weekday==="Sat"||P.weekday==="Sun") return false;
      const t=(+P.hour)*60+(+P.minute); return t>=570&&t<960;
    }catch(e){ return false; }
  }
  function showStatus(msg){
    const f=$("fresh"), open=marketOpen(), age=(data&&data.generated_at)?(Date.now()-new Date(data.generated_at).getTime())/60000:null;
    f.classList.toggle("live",open&&age!==null&&age<=75); f.classList.toggle("stale",open&&(age===null||age>75));
    if(msg){ $("status").textContent=msg; return; }
    if(!data||!data.generated_at){ $("status").textContent="No data yet"; return; }
    $("status").textContent=(open?"US market open":"US market closed")+" \u00b7 updated "+ago(data.generated_at)+((!open&&data.asof)?" \u00b7 session "+data.asof:"");
  }
  function flash(msg){ showStatus(msg); clearTimeout(flashT); flashT=setTimeout(()=>showStatus(),4000); }

  function el(tag,cls,text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
  function money(n,sign){ const a=Math.abs(n), s=a>=1000?a.toLocaleString(undefined,{maximumFractionDigits:0}):a.toFixed(2); return (sign?(n>0?"+":n<0?"\u2212":""):"")+"$"+s; }
  function pctText(n){ return (n>0?"+":n<0?"\u2212":"")+Math.abs(n).toFixed(2)+"%"; }

  // segmented controls with a sliding thumb
  function seg(box,opts,get,set){
    if(!box.dataset.built){
      box.dataset.built="1";
      const th=el("span","thumb"); box.appendChild(th);
      opts.forEach(o=>{ const b=el("button",null,o[1]); b.dataset.v=o[0]; b.onclick=()=>{ set(o[0]); sync(); render(); }; box.appendChild(b); });
    }
    function sync(){
      box.style.setProperty("--n",opts.length);
      box.querySelector(".thumb").style.setProperty("--i",Math.max(0,opts.findIndex(o=>o[0]===get())));
      box.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===get())));
    }
    sync();
  }

  function sparkSvg(arr,up){
    const NS="http://www.w3.org/2000/svg", svg=document.createElementNS(NS,"svg"); svg.setAttribute("viewBox","0 0 64 26"); svg.setAttribute("class","spark");
    if(!arr||arr.length<2) return svg;
    const lo=Math.min.apply(null,arr), hi=Math.max.apply(null,arr), span=(hi-lo)||1;
    const pts=arr.map((v,i)=>(2+i*(60/(arr.length-1))).toFixed(1)+","+(23-((v-lo)/span)*20).toFixed(1)).join(" ");
    const pl=document.createElementNS(NS,"polyline"); pl.setAttribute("points",pts); pl.setAttribute("pathLength","100"); pl.setAttribute("style","stroke:var(--"+(up?"up":"down")+")"); svg.appendChild(pl);
    return svg;
  }

  function filtered(){
    const min=curMin(); let q=(data&&data.quotes)||[];
    if(mineOnly) q=q.filter(x=>stars.has(x.t));
    if(view==="today"){
      q=q.filter(x=>unit==="pct"?Math.abs(x.pct)>=min:Math.abs(x.c)>=min);
      if(dir==="up") q=q.filter(x=>x.c>0); else if(dir==="down") q=q.filter(x=>x.c<0);
      q.sort((a,b)=>byPct?Math.abs(b.pct)-Math.abs(a.pct):Math.abs(b.c)-Math.abs(a.c));
    }else{
      q=q.filter(x=>unit==="pct"?tpct(x)>=min:x.avg>=min);
      if(dir==="up") q=q.filter(x=>x.c>0); else if(dir==="down") q=q.filter(x=>x.c<0);
      q.sort((a,b)=>byPct?(b.avg/b.p)-(a.avg/a.p):b.avg-a.avg);
    }
    return q;
  }

  function ago(iso){
    if(!iso) return "";
    const m=Math.round((Date.now()-new Date(iso).getTime())/60000);
    if(m<2) return "just now"; if(m<60) return m+" min ago";
    const h=Math.round(m/60); if(h<48) return h+(h===1?" hour":" hours")+" ago";
    return Math.round(h/24)+" days ago";
  }

  function renderMovers(){
    seg($("viewSeg"),[["today","Moved today"],["vol","Usually volatile"]],()=>view,v=>{ view=v; store.set("view",v); });
    seg($("dirSeg"),[["all","All"],["up","Up"],["down","Down"]],()=>dir,v=>{ dir=v; store.set("dir",v); });
    seg($("unitSeg"),[["usd","$"],["pct","%"]],()=>unit,v=>{ unit=v; store.set("unit",v); });
    $("minVal").textContent="\u2265 "+minLabel().replace(/\.00$/,"");
    $("mine").setAttribute("aria-pressed",String(mineOnly)); $("sort").setAttribute("aria-pressed",String(byPct));
    $("sort").textContent=byPct?"Sorted by %":"Sort by %";
    const list=$("list"); list.innerHTML=""; list.classList.toggle("enter",justLoaded); justLoaded=false;
    if(!data||!data.quotes||!data.quotes.length){
      showStatus();
      list.appendChild(el("div","empty","No prices yet. In your GitHub repo open Actions, choose \u201cUpdate quotes\u201d and press Run workflow. Then refresh this page."));

  // ===== Money math (all amounts in USD) =====
  function usd(n,sign){ const a=Math.abs(n); const t="$"+a.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); return (sign?(n>0?"+":n<0?"\u2212":""):(n<0?"\u2212":""))+t; }
  function econ(A,entry,p){
    const r=p.regPerM/1e6, dep=p.depFee?Math.max(p.depMin,A*p.depPct/100):0, wd=p.wdFee?p.wdAmt:0;
    const shares=A/entry, cashOut=A+p.orderFee+dep;
    return {r,dep,wd,shares,cashOut,net:price=>shares*price*(1-r)-p.orderFee-wd};
  }
  function sizeTrade(q,p){
    const entry=q.p, move=q.avg>0?q.avg:entry*0.02;
    const stop=Math.max(0.01,entry-p.stopK*move);
    const R=p.account*p.riskPct/100;
    const capPos=p.account*p.maxPosPct/100, cap=Math.max(0,Math.min(p.cash,capPos));
    if(cap<=0) return {error:"No cash or position cap available. Update Plan."};
    const loss=A=>{ const e=econ(A,entry,p); return e.cashOut-e.net(stop); };
    let A, bind;
    if(loss(cap)<=R){ A=cap; bind=p.cash<=capPos?"your available cash":"your max position size"; }
    else{ let lo=0,hi=cap; for(let i=0;i<60;i++){ const mid=(lo+hi)/2; if(loss(mid)>R) hi=mid; else lo=mid; } A=lo; bind="your risk per trade"; }
    if(A<1) return {error:"With this stop and your risk budget the position would be under $1. Raise the risk % or widen the budget in Plan."};
    const e=econ(A,entry,p), target=entry+p.rr*(entry-stop), lossAt=loss(A);
    const breakEven=(e.cashOut+p.orderFee+e.wd)/(e.shares*(1-e.r));
    return {entry,stop,stopPct:(entry-stop)/entry*100,move,A,shares:e.shares,cashOut:e.cashOut,bind,
      lossAt,lossPct:lossAt/p.account*100,target,gainAtTarget:e.net(target)-e.cashOut,breakEven,breakEvenPct:(breakEven/entry-1)*100,
      feesRound:2*p.orderFee+e.dep+e.wd+A*e.r,cashLeft:p.cash-e.cashOut,e};
  }
  function quoteMap(){ const m={}; ((data&&data.quotes)||[]).forEach(q=>{ m[q.t]=q; }); return m; }
  function positionsView(p){
    const qm=quoteMap(), by={};
    lots.forEach(l=>{ const o=by[l.t]||(by[l.t]={t:l.t,lots:[],shares:0,cost:0}); o.lots.push(l); o.shares+=l.usd/l.price; o.cost+=l.usd; });
    const list=Object.keys(by).map(t=>{
      const o=by[t], q=qm[t]; o.avg=o.cost/o.shares; o.q=q;
      if(q){ o.value=o.shares*q.p; o.day=o.shares*q.c; o.gross=o.value-o.cost; o.grossPct=o.gross/o.cost*100; o.netIfSold=o.value*(1-p.regPerM/1e6)-p.orderFee-o.cost; }
      return o;
    });
    const posTotal=list.reduce((a,o)=>a+(o.value||0),0), total=posTotal+p.cash;
    list.forEach(o=>{ if(!o.q) return; o.weight=o.value/total*100; o.flags=[];
      const capVal=p.maxPosPct/100*total;
      if(o.value>capVal){ const S=o.value-capVal; o.flags.push({k:"cap",S,shares:S/o.q.p,net:S*(1-p.regPerM/1e6)-p.orderFee,text:"Over your "+p.maxPosPct+"% cap"}); }
      if(o.grossPct>=p.tpPct){ const S=Math.min(o.cost,o.value); o.flags.push({k:"tp",S,shares:S/o.q.p,net:S*(1-p.regPerM/1e6)-p.orderFee,text:"Up "+o.grossPct.toFixed(1)+"%: sell enough to take your original money out"}); }
      if(o.q.p<=o.avg*(1-p.stopPct/100)){ const S=o.value; o.flags.push({k:"stop",S,shares:o.shares,net:S*(1-p.regPerM/1e6)-p.orderFee,text:"Below your "+p.stopPct+"% stop from your average price"}); }
      o.room=Math.max(0,Math.min(p.cash,capVal-o.value));
    });
    return {list,posTotal,total};
  }
  window.SwellCalc={sizeTrade,positionsView,econ,setLots:v=>{lots=v;},getPlan:()=>plan,setData:v=>{data=v;}};

  function whatIfResult(A,entry,price,p){

    const qm=quoteMap(), f=el("div","card"); f.appendChild(el("h2",null,"What if"));
    f.appendChild(el("p","hint2","Type how much you put in and what the stock does. Delta shows what you would gain or lose after Hapi's costs."));
    const dl=document.createElement("datalist"); dl.id="tks2"; ((data&&data.quotes)||[]).forEach(q=>{ const o=document.createElement("option"); o.value=q.t; dl.appendChild(o); }); f.appendChild(dl);
    function field(label,input,hint){ const r=el("div","frow"), l=el("div"); l.appendChild(el("label",null,label)); if(hint) l.appendChild(el("small",null,hint)); r.appendChild(l); r.appendChild(input); f.appendChild(r); return input; }
    function num(v,ph){ const i=document.createElement("input"); i.type="number"; i.step="any"; i.inputMode="decimal"; i.placeholder=ph||""; i.value=v===""||v===undefined?"":v; return i; }
    const iT=document.createElement("input"); iT.type="text"; iT.setAttribute("list","tks2"); iT.placeholder="NVDA"; iT.autocapitalize="characters"; iT.value=whatif.t; field("Ticker (optional)",iT);
    const iA=field("USD you put in",num(whatif.usd,"10"));
    const iE=field("Price per share when you buy",num(whatif.entry,"190"));
    const modes=[["usd","Moves by $"],["pct","Moves by %"],["price","New price"]];
    const sg=el("div","seg"); sg.style.margin="10px 0"; sg.style.setProperty("--n",3);
    const th=el("span","thumb"); sg.appendChild(th);
    modes.forEach(m=>{ const b=el("button",null,m[1]); b.dataset.v=m[0]; b.onclick=()=>{ whatif.mode=m[0]; if(m[0]==="price"&&whatif.entry) iV.value=(+whatif.entry*1.1).toFixed(2); sync(); update(); }; sg.appendChild(b); });
    f.appendChild(sg);
    const iV=field("Amount",num(whatif.val,"20"));
    const out=el("div"); f.appendChild(out); box.appendChild(f);
    function sync(){ th.style.setProperty("--i",modes.findIndex(m=>m[0]===whatif.mode)); sg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===whatif.mode))); }
    function readAll(){ whatif.t=iT.value.trim().toUpperCase(); whatif.usd=parseFloat(iA.value); whatif.entry=parseFloat(iE.value); whatif.val=parseFloat(iV.value); }
    function update(){
      readAll(); out.innerHTML="";
      const A=whatif.usd, entry=whatif.entry, v=whatif.val;
      if(!(A>0)||!(entry>0)||isNaN(v)){ out.appendChild(el("p","hint2","Fill in the amount, the buy price and the move.")); return; }
      const price=Math.max(0, whatif.mode==="usd"?entry+v:(whatif.mode==="pct"?entry*(1+v/100):v));
      const r=whatIfResult(A,entry,price,plan), up=r.netPL>=0;
      const panel=el("div","panel"); panel.style.borderRadius="14px"; panel.style.marginTop="12px";
      panel.appendChild(el("p","hint2","You buy "+r.shares.toFixed(4)+" shares at "+usd(entry)+". It goes to "+usd(price)+" ("+(price>=entry?"+":"")+((price/entry-1)*100).toFixed(1)+"%)."));
      panel.appendChild(el("div","big-amt "+(up?"up":"down"),(up?"You gain ":"You lose ")+usd(Math.abs(r.netPL))));
      kv(panel,"Gain or loss before fees",usd(r.gross,true));
      kv(panel,"Fees, in and out",usd(r.fees));
      kv(panel,"Net result on "+usd(r.e.cashOut)+" out of pocket",usd(r.netPL,true)+" ("+(r.pct>=0?"+":"")+r.pct.toFixed(1)+"%)");
      kv(panel,"Money back in your account",usd(r.e.net(price)));
      kv(panel,"Break-even price",usd(r.breakEven)+" ("+(r.breakEven>=entry?"+":"")+((r.breakEven/entry-1)*100).toFixed(2)+"%)");
      const share=r.fees/A*100;
      if(share>=2) panel.appendChild(el("p","hint2","Fees take about "+share.toFixed(1)+"% of the "+usd(A)+" you put in. With small amounts, costs weigh a lot."));
      if(plan.depFee||plan.wdFee) panel.appendChild(el("p","hint2","Deposit and withdrawal fees are included because they are turned on in Plan."));
      out.appendChild(panel);
      const tb=el("div","panel"); tb.style.borderRadius="14px"; tb.style.marginTop="10px"; tb.appendChild(el("h3",null,"Same "+usd(A)+" at other prices"));
      [-20,-10,-5,5,10,20].forEach(pc=>{ const px=entry*(1+pc/100), q=whatIfResult(A,entry,px,plan);
        kv(tb,(pc>0?"+":"\u2212")+Math.abs(pc)+"%  ("+usd(px-entry,true)+" per share)",usd(q.netPL,true)); });
      out.appendChild(tb);
    }
    iT.addEventListener("change",()=>{ const q=qm[iT.value.trim().toUpperCase()]; if(q){ iE.value=q.p; } update(); });
    [iA,iE,iV].forEach(i=>i.addEventListener("input",update));
    sync(); update();
  }

  function render(){
    seg($("tabSeg"),[["movers","Movers"],["calc","What if"],["pos","Positions"],["plan","Plan"]],()=>tab,v=>{ tab=v; store.set("tab",v); });
    $("moversPane").classList.toggle("hidden",tab!=="movers"); $("calcPane").classList.toggle("hidden",tab!=="calc"); $("posPane").classList.toggle("hidden",tab!=="pos"); $("planPane").classList.toggle("hidden",tab!=="plan");
    if(tab==="movers") renderMovers();
    else{ showStatus(); if(tab==="calc") renderCalc(); else if(tab==="pos") renderPos(); else renderPlan(); }
  }


  // ===== Pull down to refresh =====
  (function(){
    let y0=null, dy=0, active=false, busy=false;
    const wrap=document.querySelector(".wrap"), ptr=$("ptr"), arrow=ptr.querySelector("svg"), MAX=90, TH=64;
    function back(){ wrap.style.transition="transform .45s cubic-bezier(.22,1,.36,1)"; wrap.style.transform=""; ptr.style.opacity="0"; setTimeout(()=>{ wrap.style.transition=""; },480); }
    document.addEventListener("touchstart",e=>{ if(busy||window.scrollY>0||e.touches.length!==1){ y0=null; return; } y0=e.touches[0].clientY; dy=0; active=false; },{passive:true});
    document.addEventListener("touchmove",e=>{
      if(y0===null) return;
      const d=e.touches[0].clientY-y0;
      if(window.scrollY>0){ y0=null; return; }
      if(d<=0){ if(active){ wrap.style.transform=""; ptr.style.opacity="0"; } return; }
      active=true; dy=Math.min(MAX,d*0.5);
      wrap.style.transform="translateY("+dy+"px)"; ptr.style.opacity=String(Math.min(1,dy/TH));
      arrow.style.transform="rotate("+Math.min(180,dy/TH*180)+"deg)";
    },{passive:true});
    document.addEventListener("touchend",async()=>{
      if(y0===null||!active){ y0=null; return; }
      const go=dy>=TH; y0=null; active=false;
      if(go){ busy=true; ptr.classList.add("spin"); arrow.style.transform=""; wrap.style.transition="transform .3s"; wrap.style.transform="translateY(52px)"; await load(true); ptr.classList.remove("spin"); busy=false; }
      back();
    },{passive:true});
  })();

  // icon for Add to Home Screen: a glowing delta on dark
  function drawDelta(g,n){
    const k=n/360;
    function tri(cx,cy,r,rd){
      const pts=[[cx,cy-r],[cx+r*0.92,cy+r*0.62],[cx-r*0.92,cy+r*0.62]]; g.beginPath();
      for(let i=0;i<3;i++){ const p0=pts[(i+2)%3],p1=pts[i],p2=pts[(i+1)%3];
        const v1=[p0[0]-p1[0],p0[1]-p1[1]],v2=[p2[0]-p1[0],p2[1]-p1[1]],l1=Math.hypot(v1[0],v1[1]),l2=Math.hypot(v2[0],v2[1]);
        const a=[p1[0]+v1[0]/l1*rd,p1[1]+v1[1]/l1*rd], b=[p1[0]+v2[0]/l2*rd,p1[1]+v2[1]/l2*rd];
        if(i===0) g.moveTo(a[0],a[1]); else g.lineTo(a[0],a[1]);
        g.quadraticCurveTo(p1[0],p1[1],b[0],b[1]); }
      g.closePath();
    }
    const bg=g.createRadialGradient(n*.5,n*.35,10*k,n*.5,n*.5,n*.75); bg.addColorStop(0,"#1b2636"); bg.addColorStop(1,"#07090d"); g.fillStyle=bg; g.fillRect(0,0,n,n);
    const st=g.createLinearGradient(60*k,300*k,300*k,60*k); st.addColorStop(0,"#22c55e"); st.addColorStop(.55,"#2dd4bf"); st.addColorStop(1,"#38bdf8");
    g.lineWidth=34*k; g.lineJoin="round"; g.strokeStyle=st; tri(n/2,n*.52,n*.30,26*k);
    g.shadowColor="rgba(45,212,191,.55)"; g.shadowBlur=40*k; g.stroke(); g.shadowBlur=0;
    g.fillStyle="#fff"; tri(n/2,n*.60,n*.085,10*k); g.fill();
  }
  // END drawDelta
  try{
    const c=document.createElement("canvas"); c.width=c.height=180; drawDelta(c.getContext("2d"),180);
    $("touchIcon").href=c.toDataURL("image/png");
  }catch(e){}

  render(); load();
})();
</script>
</body>
</html>
