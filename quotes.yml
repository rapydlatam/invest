name: Update quotes

on:
  schedule:
    # every 30 minutes on weekdays during US market hours (UTC, covers daylight saving)
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install yfinance pandas
      - name: Fetch quotes
        run: python scripts/fetch_quotes.py
      - name: Commit data
        run: |
          git config user.name "swell-bot"
          git config user.email "swell-bot@users.noreply.github.com"
          git add data/quotes.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update quotes"
            git push
          fi
